<svg xmlns="http://www.w3.org/2000/svg" width="220mm" height="200mm" viewBox="0 0 220 200">
  <!--
    Curve-roundness test. Three same-radius "circles" drawn three ways, so the
    converter's curve flattening can be compared directly:
      left    12-sided polygon  (coarse -> visibly faceted)
      middle  <circle> element  (flattened by Tolerance -> smooth)
      right   36-sided polygon  (fine -> nearly smooth)
    Plus an ellipse and a cubic-bezier path for the other curve types.
    Stroke-only (fill="none"), so the converter draws centerlines.
  -->
  <g fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="35,25 50,29.02 60.98,40 65,55 60.98,70 50,80.98 35,85 20,80.98 9.02,70 5,55 9.02,40 20,29.02"/>
    <circle cx="105" cy="55" r="30"/>
    <polygon points="175,25 180.21,25.46 185.26,26.81 190,29.02 194.28,32.02 197.98,35.72 200.98,40 203.19,44.74 204.54,49.79 205,55 204.54,60.21 203.19,65.26 200.98,70 197.98,74.28 194.28,77.98 190,80.98 185.26,83.19 180.21,84.54 175,85 169.79,84.54 164.74,83.19 160,80.98 155.72,77.98 152.02,74.28 149.02,70 146.81,65.26 145.46,60.21 145,55 145.46,49.79 146.81,44.74 149.02,40 152.02,35.72 155.72,32.02 160,29.02 164.74,26.81 169.79,25.46"/>
    <ellipse cx="60" cy="150" rx="42" ry="26"/>
    <path d="M 118 168 C 140 128, 168 192, 200 150"/>
  </g>
</svg>
