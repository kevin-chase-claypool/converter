<svg xmlns="http://www.w3.org/2000/svg" width="220mm" height="200mm" viewBox="0 0 220 200">
  <!--
    Pen-free visual motion sample. Explicit polylines avoid unsupported SVG arc
    commands while keeping the deliberately hand-drawn, kindergarten style.
  -->
