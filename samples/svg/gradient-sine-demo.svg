<svg xmlns="http://www.w3.org/2000/svg" width="180" height="120" viewBox="0 0 180 120">
  <!-- Gradient tone for the Fill pattern "sine_gradient": Fill source Auto
       routes these paint servers to the rendered image, and the tone comes
       back as wave amplitude instead of hatch density. -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <linearGradient id="hills" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#4d4d4d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="160" height="45" fill="url(#fade)"/>
  <circle cx="45" cy="85" r="28" fill="url(#orb)"/>
  <rect x="90" y="57" width="80" height="56" fill="url(#hills)"/>
</svg>
