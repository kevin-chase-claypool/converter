<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">How SVG raster shading becomes hatch lines</title>
  <desc id="description">A vector diagram showing an SVG gradient rendered to pixels, converted to darkness values, thresholded into layers, and emitted as hatch lines.</desc>
  <defs>
    <linearGradient id="tone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <pattern id="fineHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#194b78" stroke-width="2"/>
    </pattern>
    <pattern id="denseHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#123e64" stroke-width="1.6"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/>
    </filter>
    <style>
      .heading { font: 700 34px system-ui, sans-serif; fill: #10243b; }
      .label { font: 700 20px system-ui, sans-serif; fill: #163c61; }
      .body { font: 18px system-ui, sans-serif; fill: #273b50; }
      .math { font: italic 23px Georgia, serif; fill: #10243b; }
      .small { font: 15px system-ui, sans-serif; fill: #43566b; }
      .step { fill: #fff; stroke: #c9d8e7; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .arrow { fill: none; stroke: #4b85b7; stroke-width: 4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4b85b7"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#f4f8fc"/>
  <text x="600" y="58" text-anchor="middle" class="heading">Raster shading: SVG appearance → pen paths</text>
  <text x="600" y="88" text-anchor="middle" class="body">The converter samples the rendered SVG, measures darkness, then keeps hatch geometry only where it is dark enough.</text>

  <path d="M274 260 H322 M550 260 H598 M826 260 H874" class="arrow"/>

  <g transform="translate(40 130)">
    <rect width="235" height="255" class="step"/>
    <text x="22" y="38" class="label">1. Render the SVG</text>
    <rect x="25" y="61" width="185" height="112" rx="10" fill="url(#tone)" stroke="#67819b" stroke-width="2"/>
    <path d="M53 150 C78 82 148 75 183 133" fill="none" stroke="#e8514d" stroke-width="7" stroke-linecap="round"/>
    <text x="22" y="205" class="body">Gradients, transparency, and</text>
    <text x="22" y="229" class="body">embedded images become pixels.</text>
  </g>

  <g transform="translate(325 130)">
    <rect width="225" height="255" class="step"/>
    <text x="20" y="38" class="label">2. Sample a pixel</text>
    <g transform="translate(31 62)">
      <rect width="38" height="38" fill="#f7f7f7"/><rect x="40" width="38" height="38" fill="#d1d4d7"/><rect x="80" width="38" height="38" fill="#9299a1"/><rect x="120" width="38" height="38" fill="#273340"/>
      <rect y="40" width="38" height="38" fill="#e4e5e6"/><rect x="40" y="40" width="38" height="38" fill="#b5bbc0"/><rect x="80" y="40" width="38" height="38" fill="#65717b"/><rect x="120" y="40" width="38" height="38" fill="#15202c"/>
      <rect y="80" width="38" height="38" fill="#c4c8cc"/><rect x="40" y="80" width="38" height="38" fill="#8d969e"/><rect x="80" y="80" width="38" height="38" fill="#3d4a57"/><rect x="120" y="80" width="38" height="38" fill="#09131c"/>
    </g>
    <text x="20" y="207" class="math">L = .2126R + .7152G + .0722B</text>
    <text x="20" y="235" class="small">L is perceptual luminance (lightness).</text>
  </g>

  <g transform="translate(600 130)">
    <rect width="225" height="255" class="step"/>
    <text x="20" y="38" class="label">3. Find darkness</text>
    <circle cx="112" cy="112" r="57" fill="#1d2b39"/>
    <path d="M112 55 A57 57 0 0 0 112 169" fill="#f7fbff"/>
    <text x="112" y="119" text-anchor="middle" class="body" fill="#fff">dark</text>
    <text x="20" y="207" class="math">D = (1 − L)α</text>
    <text x="20" y="235" class="small">Transparent pixels have α = 0, so D = 0.</text>
  </g>

  <g transform="translate(875 130)">
    <rect width="285" height="255" class="step"/>
    <text x="20" y="38" class="label">4. Threshold each layer</text>
    <rect x="22" y="59" width="240" height="30" fill="url(#tone)" rx="6"/>
    <line x1="70" y1="54" x2="70" y2="96" stroke="#e8514d" stroke-width="3"/><line x1="130" y1="54" x2="130" y2="96" stroke="#e8514d" stroke-width="3"/><line x1="190" y1="54" x2="190" y2="96" stroke="#e8514d" stroke-width="3"/>
    <text x="20" y="130" class="math">Tₖ = (k + 1) / (N + 1)</text>
    <text x="20" y="163" class="math">draw when D ≥ Tₖ</text>
    <text x="20" y="207" class="body">Darker pixels pass more thresholds,</text>
    <text x="20" y="231" class="body">so they receive more ink layers.</text>
  </g>

  <g transform="translate(60 454)">
    <rect width="1080" height="245" class="step"/>
    <text x="28" y="40" class="label">Result: layer hatching approximates tonal value</text>
    <text x="28" y="68" class="body">At layer k, spacing decreases as the layer number rises:</text>
    <text x="570" y="68" class="math">sₖ = s₀ / √(k + 1)</text>

    <g transform="translate(34 91)">
      <rect width="135" height="105" rx="8" fill="#fff" stroke="#c9d8e7"/>
      <text x="67" y="132" text-anchor="middle" class="small">D &lt; T₀: no ink</text>
      <rect x="165" width="135" height="105" rx="8" fill="url(#fineHatch)" stroke="#c9d8e7"/>
      <text x="232" y="132" text-anchor="middle" class="small">one layer</text>
      <rect x="330" width="135" height="105" rx="8" fill="url(#fineHatch)" stroke="#c9d8e7"/>
      <path d="M338 92 L455 13 M338 68 L432 5" stroke="#123e64" stroke-width="2"/>
      <text x="397" y="132" text-anchor="middle" class="small">two layers</text>
      <rect x="495" width="135" height="105" rx="8" fill="url(#denseHatch)" stroke="#c9d8e7"/>
      <path d="M503 92 L620 13 M503 68 L597 5" stroke="#0a304f" stroke-width="2"/>
      <text x="562" y="132" text-anchor="middle" class="small">three layers</text>
      <rect x="660" width="135" height="105" rx="8" fill="#193b59" stroke="#c9d8e7"/>
      <path d="M665 100 L785 20 M680 105 L795 28 M662 74 L754 12" stroke="#d9e9f6" stroke-width="1.5"/>
      <text x="727" y="132" text-anchor="middle" class="small">very dark</text>
      <path d="M822 53 H1012" class="arrow"/>
      <text x="916" y="31" text-anchor="middle" class="body">increasing darkness / pen density</text>
    </g>
  </g>
</svg>
