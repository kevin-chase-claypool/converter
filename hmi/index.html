<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <title>XY-Theta Plotter HMI</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell" aria-live="off">
    <header id="app-bar" class="app-bar"></header>
    <div id="dro" class="dro" aria-label="Machine coordinates"></div>
    <main id="view" class="view" tabindex="-1"></main>
    <section id="transport" class="transport" role="group" aria-label="Machine transport controls"></section>
    <footer id="footer" class="footer" aria-live="polite"></footer>
  </div>
  <div id="dialog-root"></div>
  <div id="idle-overlay" class="idle-overlay" role="dialog" aria-modal="true" aria-labelledby="idle-title" hidden>
    <div class="idle-card">
      <div class="brand-mark idle-brand" aria-hidden="true">XYθ</div>
      <h2 id="idle-title">Display paused</h2>
      <p>Touch anywhere to continue.</p>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This HMI requires JavaScript. No motion control is available.</noscript>
</body>
</html>
