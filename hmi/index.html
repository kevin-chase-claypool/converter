<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <title>XY-Theta Plotter HMI</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell" aria-live="off">
    <header id="app-bar" class="app-bar"></header>
    <div id="dro" class="dro" aria-label="Machine coordinates"></div>
    <main id="view" class="view" tabindex="-1"></main>
    <section id="transport" class="transport" role="group" aria-label="Machine transport controls"></section>
  </div>
  <div id="dialog-root"></div>
  <div id="splash-overlay" class="splash-overlay" role="dialog" aria-modal="true" aria-labelledby="splash-title" tabindex="-1">
    <div class="splash-content">
      <div class="splash-stage" aria-hidden="true">
        <img class="splash-ring" src="./assets/cmy-ring-v12.png" alt="">
        <div class="splash-core">XYθ</div>
      </div>
      <div class="splash-kicker">C O N T R O L</div>
      <div class="splash-sub">PRECISION MOTION / OPERATOR CONSOLE</div>
      <div class="splash-rule"></div>
      <h2 id="splash-title">INITIALIZING OPERATOR INTERFACE</h2>
      <p id="splash-message">Preparing local console</p>
      <div id="splash-mode" class="splash-mode">UI PREVIEW · MOTION LOCKED</div>
      <div class="splash-hint">TOUCH ANYWHERE TO CONTINUE</div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This HMI requires JavaScript. No motion control is available.</noscript>
</body>
</html>
