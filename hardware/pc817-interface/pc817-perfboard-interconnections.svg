<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1500" viewBox="0 0 2200 1500">
  <style>
    .title { font: bold 34px Arial, sans-serif; fill: #17212b; }
    .sub { font: 19px Arial, sans-serif; fill: #3e5267; }
    .legend { font: bold 18px Arial, sans-serif; fill: #17212b; }
    .note { font: 17px Arial, sans-serif; fill: #17212b; }
    .net { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .92; }
    .node { stroke: white; stroke-width: 3; }
    .dash { stroke-dasharray: 14 10; }
  </style>
  <rect width="2200" height="1500" fill="#f7fafc"/>
  <text x="80" y="62" class="title">PC817C PERFBOARD — UNDERSIDE INTERCONNECTION OVERLAY</text>
  <text x="80" y="93" class="sub">Component side shown translucent. Colored paths are insulated underside wires; circles mark pads joined on each net.</text>
  <image href="pc817-perfboard-layout-v1.png" x="0" y="0" width="2200" height="1500" opacity=".30"/>

  <!-- controller domain -->
  <path d="M150 260 L255 260 L255 470" class="net" stroke="#d94132"/>
  <path d="M150 365 L65 365 L65 910 L990 910 L990 785" class="net" stroke="#a51d31"/>
  <path d="M150 470 L675 365 L255 365" class="net" stroke="#f06b26"/>
  <path d="M150 575 L675 575 L255 575" class="net" stroke="#f2a900"/>
  <path d="M150 680 L1410 680" class="net dash" stroke="#d79a00"/>

  <!-- LED anode nets and U3 home output -->
  <path d="M570 260 L570 365 L675 260" class="net" stroke="#e2549b"/>
  <path d="M570 470 L570 575 L675 470" class="net" stroke="#bb4bc5"/>
  <path d="M570 680 L570 785 L675 680" class="net" stroke="#7d57c1"/>
  <path d="M990 680 L1095 680" class="net dash" stroke="#d79a00"/>

  <!-- toolhead domain -->
  <path d="M1515 260 L1410 260 L1410 470 L1095 785" class="net" stroke="#19a2d7"/>
  <path d="M1515 365 L1200 365 L1200 575 L1200 785 L990 575 L990 365 L675 785 L255 785" class="net" stroke="#1769d1"/>
  <path d="M1515 470 L990 260 L1095 260 L1095 365" class="net" stroke="#10a87b"/>
  <path d="M1515 575 L990 470 L1095 470 L1095 575" class="net" stroke="#008caa"/>
  <path d="M1515 680 L255 680" class="net" stroke="#7950c5"/>

  <!-- pad markers -->
  <g fill="#d94132" class="node"><circle cx="150" cy="260" r="11"/><circle cx="255" cy="260" r="11"/><circle cx="255" cy="470" r="11"/></g>
  <g fill="#a51d31" class="node"><circle cx="150" cy="365" r="11"/><circle cx="990" cy="785" r="11"/></g>
  <g fill="#f06b26" class="node"><circle cx="150" cy="470" r="11"/><circle cx="675" cy="365" r="11"/><circle cx="255" cy="365" r="11"/></g>
  <g fill="#f2a900" class="node"><circle cx="150" cy="575" r="11"/><circle cx="675" cy="575" r="11"/><circle cx="255" cy="575" r="11"/></g>
  <g fill="#d79a00" class="node"><circle cx="150" cy="680" r="11"/><circle cx="1410" cy="680" r="11"/><circle cx="990" cy="680" r="11"/><circle cx="1095" cy="680" r="11"/></g>
  <g fill="#e2549b" class="node"><circle cx="570" cy="260" r="11"/><circle cx="570" cy="365" r="11"/><circle cx="675" cy="260" r="11"/></g>
  <g fill="#bb4bc5" class="node"><circle cx="570" cy="470" r="11"/><circle cx="570" cy="575" r="11"/><circle cx="675" cy="470" r="11"/></g>
  <g fill="#7d57c1" class="node"><circle cx="570" cy="680" r="11"/><circle cx="570" cy="785" r="11"/><circle cx="675" cy="680" r="11"/></g>
  <g fill="#19a2d7" class="node"><circle cx="1515" cy="260" r="11"/><circle cx="1410" cy="260" r="11"/><circle cx="1410" cy="470" r="11"/><circle cx="1095" cy="785" r="11"/></g>
  <g fill="#1769d1" class="node"><circle cx="1515" cy="365" r="11"/><circle cx="1200" cy="365" r="11"/><circle cx="1200" cy="575" r="11"/><circle cx="1200" cy="785" r="11"/><circle cx="990" cy="365" r="11"/><circle cx="990" cy="575" r="11"/><circle cx="675" cy="785" r="11"/><circle cx="255" cy="785" r="11"/></g>
  <g fill="#10a87b" class="node"><circle cx="1515" cy="470" r="11"/><circle cx="990" cy="260" r="11"/><circle cx="1095" cy="260" r="11"/><circle cx="1095" cy="365" r="11"/></g>
  <g fill="#008caa" class="node"><circle cx="1515" cy="575" r="11"/><circle cx="990" cy="470" r="11"/><circle cx="1095" cy="470" r="11"/><circle cx="1095" cy="575" r="11"/></g>
  <g fill="#7950c5" class="node"><circle cx="1515" cy="680" r="11"/><circle cx="255" cy="680" r="11"/></g>

  <!-- legend -->
  <rect x="1640" y="145" width="500" height="840" rx="18" fill="#ffffff" stroke="#9eb0c1" stroke-width="3" opacity=".96"/>
  <text x="1680" y="195" class="title" style="font-size:28px">NET LEGEND</text>
  <g class="legend">
    <circle cx="1685" cy="245" r="10" fill="#d94132"/><text x="1710" y="252">CTRL_5V: A1, B1, B3</text>
    <circle cx="1685" cy="295" r="10" fill="#a51d31"/><text x="1710" y="302">CTRL_GND: A2, I6</text>
    <circle cx="1685" cy="345" r="10" fill="#f06b26"/><text x="1710" y="352">ENA: A3, F2, B2</text>
    <circle cx="1685" cy="395" r="10" fill="#f2a900"/><text x="1710" y="402">AUX0: A4, F4, B4</text>
    <circle cx="1685" cy="445" r="10" fill="#d79a00"/><text x="1710" y="452">A_HOME / R6: open</text>
    <circle cx="1685" cy="505" r="10" fill="#e2549b"/><text x="1710" y="512">LED1_A: E1, E2, F1</text>
    <circle cx="1685" cy="555" r="10" fill="#bb4bc5"/><text x="1710" y="562">LED2_A: E3, E4, F3</text>
    <circle cx="1685" cy="605" r="10" fill="#7d57c1"/><text x="1710" y="612">LED3_A: E5, E6, F5</text>
    <circle cx="1685" cy="665" r="10" fill="#10a87b"/><text x="1710" y="672">GP8: N3, I1, J1, J2</text>
    <circle cx="1685" cy="715" r="10" fill="#008caa"/><text x="1710" y="722">GP10: N4, I3, J3, J4</text>
    <circle cx="1685" cy="765" r="10" fill="#7950c5"/><text x="1710" y="772">GP9: N5, B5</text>
    <circle cx="1685" cy="815" r="10" fill="#19a2d7"/><text x="1710" y="822">TOOL_3V3: N1, M1, M3, J6</text>
    <circle cx="1685" cy="865" r="10" fill="#1769d1"/><text x="1710" y="872">TOOL_GND: N2, I2, I4, F6, K2, K4, K6, B6</text>
  </g>
  <rect x="1640" y="1020" width="500" height="225" rx="18" fill="#fff7dc" stroke="#b77b00" stroke-width="3"/>
  <text x="1680" y="1070" class="title" style="font-size:25px">SAFETY NOTE</text>
  <text x="1680" y="1110" class="note">Dashed yellow paths are intentionally open:</text>
  <text x="1680" y="1140" class="note">R6 is DNP. Do not attach A_HOME until E-18.</text>
  <text x="1680" y="1180" class="note">CTRL_GND and TOOL_GND must never join.</text>
  <text x="1680" y="1210" class="note">This is a logical interconnection overlay,</text>
  <text x="1680" y="1235" class="note">not a suggested physical wire-routing path.</text>
</svg>
