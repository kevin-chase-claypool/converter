  <path class="wire p12" d="M750 218 H840"/><path class="wire gnd" d="M750 254 H840"/>
  <rect class="term" x="1025" y="205" width="128" height="26"/><text class="label" x="1048" y="224">F1 RP23</text>
  <rect class="term" x="1025" y="285" width="128" height="26"/><text class="label" x="1060" y="304">F2 X</text>
  <rect class="term" x="1025" y="365" width="128" height="26"/><text class="label" x="1060" y="384">F3 Y</text>
  <rect class="term" x="1025" y="445" width="128" height="26"/><text class="label" x="1060" y="464">F4 A</text>
  <rect class="term" x="1025" y="525" width="128" height="26"/><text class="label" x="1044" y="544">F5 6V REG</text>
  <circle class="pin" cx="1195" cy="218" r="7"/><circle class="pin" cx="1195" cy="244" r="7"/><circle class="pin" cx="1195" cy="298" r="7"/><circle class="pin" cx="1195" cy="324" r="7"/><circle class="pin" cx="1195" cy="378" r="7"/><circle class="pin" cx="1195" cy="404" r="7"/><circle class="pin" cx="1195" cy="458" r="7"/><circle class="pin" cx="1195" cy="484" r="7"/><circle class="pin" cx="1010" cy="538" r="7"/><circle class="pin" cx="1010" cy="564" r="7"/>

