<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
  <defs>
    <style>
      .bg{fill:#f7f8fa}.box{fill:#fff;stroke:#1f2937;stroke-width:2.5;rx:10;ry:10}.source{fill:#fef3c7;stroke:#92400e}.dist{fill:#e0f2fe;stroke:#075985}.din{fill:#dcfce7;stroke:#166534}.load{fill:#f3e8ff;stroke:#6b21a8}.tool{fill:#ccfbf1;stroke:#0f766e}.sig{fill:#fff7ed;stroke:#b45309}.warn{fill:#fff1f2;stroke:#be123c}.term{fill:#fff;stroke:#111827;stroke-width:1.5;rx:2;ry:2}.pin{fill:#fff;stroke:#111827;stroke-width:2}.title{font:700 24px Arial,sans-serif;fill:#111827}.subtitle{font:400 14px Arial,sans-serif;fill:#374151}.label{font:700 15px Arial,sans-serif;fill:#111827}.small{font:400 13px Arial,sans-serif;fill:#374151}.tiny{font:400 11px Arial,sans-serif;fill:#374151}.wire{fill:none;stroke-width:4;stroke-linecap:square;stroke-linejoin:miter}.p12{stroke:#dc2626}.gnd{stroke:#111827}.p6{stroke:#db2777}.p5{stroke:#16a34a}.p33{stroke:#0d9488}.earth{stroke:#65a30d;stroke-dasharray:9 6}.m3{stroke:#7c3aed}.arm{stroke:#2563eb}.home{stroke:#be123c;stroke-dasharray:9 6}.zone{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:10 8}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1500"/>
  <text class="title" x="45" y="42">Theta plotter toolhead power tree and interface schematic</text>
  <text class="subtitle" x="45" y="68">Toolhead rails plus legacy signal wiring. The E-stop/K1/HD064RT feed order is defined separately in docs/hardware/estop-topology.svg.</text>

  <rect class="box" x="55" y="115" width="245" height="130"/>
  <text class="title" x="85" y="152">AC inlet / switch</text>
  <text class="subtitle" x="85" y="176">fuse, enclosure, strain relief TBD</text>
  <rect class="term" x="82" y="200" width="58" height="28"/><text class="label" x="105" y="220">L</text>
  <rect class="term" x="150" y="200" width="58" height="28"/><text class="label" x="173" y="220">N</text>
  <rect class="term" x="218" y="200" width="58" height="28"/><text class="label" x="235" y="220">PE</text>
  <circle class="pin" cx="300" cy="214" r="7"/><circle class="pin" cx="300" cy="234" r="7"/><circle class="pin" cx="300" cy="254" r="7"/>

  <rect class="box source" x="390" y="105" width="360" height="185"/>
  <text class="title" x="425" y="143">MEISHILE S-120-12</text>
  <text class="subtitle" x="425" y="166">12 VDC, 10 A nominal main supply</text>
  <rect class="term" x="425" y="202" width="50" height="30"/><text class="label" x="444" y="222">L</text>
  <rect class="term" x="485" y="202" width="50" height="30"/><text class="label" x="504" y="222">N</text>
  <rect class="term" x="545" y="202" width="62" height="30"/><text class="label" x="566" y="222">PE</text>
  <rect class="term" x="625" y="202" width="50" height="30"/><text class="label" x="642" y="222">-V</text>
  <rect class="term" x="685" y="202" width="50" height="30"/><text class="label" x="701" y="222">+V</text>
  <text class="small" x="425" y="260">Terminals 4/5 = -V, 6/7 = +V. Allocation TBD.</text>
  <circle class="pin" cx="390" cy="214" r="7"/><circle class="pin" cx="390" cy="234" r="7"/><circle class="pin" cx="390" cy="254" r="7"/>
  <circle class="pin" cx="750" cy="218" r="7"/><circle class="pin" cx="750" cy="254" r="7"/>
  <path class="wire p12" d="M300 214 H390"/><path class="wire gnd" d="M300 234 H390"/><path class="wire earth" d="M300 254 H390"/>

