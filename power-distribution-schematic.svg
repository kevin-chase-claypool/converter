  <line class="zone" x1="1265" y1="625" x2="1265" y2="1085"/><text class="label" x="1178" y="618">drag-chain boundary</text>

  <rect class="box" x="1320" y="660" width="300" height="170"/>
  <text class="title" x="1350" y="698">Toolhead 6 V terminal</text><text class="subtitle" x="1350" y="721">single 6 V + GND pair enters here</text>
  <rect class="term" x="1350" y="745" width="80" height="26"/><text class="label" x="1367" y="764">6V IN</text><rect class="term" x="1350" y="775" width="80" height="26"/><text class="label" x="1362" y="794">GND IN</text>
  <rect class="term" x="1505" y="705" width="80" height="26"/><text class="label" x="1515" y="724">6V DRV</text><rect class="term" x="1505" y="735" width="80" height="26"/><text class="label" x="1510" y="754">GND DRV</text>
  <rect class="term" x="1505" y="785" width="80" height="26"/><text class="label" x="1512" y="804">6V 5REG</text><rect class="term" x="1505" y="815" width="80" height="26"/><text class="label" x="1507" y="834">GND 5REG</text>
  <circle class="pin" cx="1320" cy="759" r="7"/><circle class="pin" cx="1320" cy="789" r="7"/><circle class="pin" cx="1620" cy="718" r="7"/><circle class="pin" cx="1620" cy="748" r="7"/><circle class="pin" cx="1620" cy="798" r="7"/><circle class="pin" cx="1620" cy="828" r="7"/>
  <path class="wire p6" d="M1195 759 H1320"/><path class="wire gnd" d="M1195 789 H1320"/>

  <rect class="box din" x="1320" y="870" width="300" height="84"/><text class="title" x="1350" y="902">DRV8833</text><text class="subtitle" x="1350" y="925">toolhead motor driver</text><circle class="pin" cx="1620" cy="906" r="7"/><circle class="pin" cx="1620" cy="934" r="7"/><text class="tiny" x="1636" y="900">VM/VCC</text><text class="tiny" x="1636" y="952">GND</text><path class="wire p6" d="M1620 718 H1705 V906 H1620"/><path class="wire gnd" d="M1620 748 H1730 V934 H1620"/>
  <rect class="box din" x="1320" y="990" width="300" height="92"/><text class="title" x="1350" y="1026">Pololu S7V8F5</text><text class="subtitle" x="1350" y="1049">toolhead-local 5 V regulator</text><circle class="pin" cx="1320" cy="1026" r="7"/><circle class="pin" cx="1320" cy="1056" r="7"/><circle class="pin" cx="1620" cy="1026" r="7"/><circle class="pin" cx="1620" cy="1056" r="7"/><text class="tiny" x="1288" y="1020">VIN</text><text class="tiny" x="1275" y="1074">GND</text><text class="tiny" x="1636" y="1020">VOUT</text><text class="tiny" x="1636" y="1074">GND</text><path class="wire p6" d="M1620 798 H1660 V980 H1320 V1026"/><path class="wire gnd" d="M1620 828 H1685 V970 H1320 V1056"/>

  <rect class="box tool" x="1320" y="1110" width="300" height="70"/>
  <text class="title" x="1350" y="1140">Pro Micro power</text>
  <text class="subtitle" x="1350" y="1163">S7V8F5 feeds RAW/5V and GND</text>
  <circle class="pin" cx="1620" cy="1130" r="7"/><circle class="pin" cx="1620" cy="1160" r="7"/>
  <text class="tiny" x="1636" y="1124">RAW/5V</text><text class="tiny" x="1636" y="1178">GND</text>
  <path class="wire p5" d="M1620 1026 H1705 V1130 H1620"/>
  <path class="wire gnd" d="M1620 1056 H1730 V1160 H1620"/>

  <rect class="box" x="55" y="650" width="520" height="160"/>
  <text class="title" x="85" y="687">Legend</text>
  <line class="wire p12" x1="85" y1="715" x2="140" y2="715"/><text class="small" x="155" y="720">12 V / 5 V ref</text>
  <line class="wire p6" x1="285" y1="715" x2="340" y2="715"/><text class="small" x="355" y="720">6 V</text>
  <line class="wire p33" x1="85" y1="750" x2="140" y2="750"/><text class="small" x="155" y="755">3.3 V</text>
  <line class="wire gnd" x1="285" y1="750" x2="340" y2="750"/><text class="small" x="355" y="755">return</text>
  <line class="wire m3" x1="85" y1="785" x2="140" y2="785"/><text class="small" x="155" y="790">M3/M5</text>
  <line class="wire arm" x1="285" y1="785" x2="340" y2="785"/><text class="small" x="355" y="790">HOME_ARM</text>

  <text class="title" x="55" y="1165">RP23CNC to Pro Micro signal isolation</text>
  <text class="subtitle" x="55" y="1190">B07WFGTNQC is drawn for RP23CNC-to-Pro-Micro command inputs only. Use a separate verified switch-like return path for A_HOME unless the received board proves safe for mixed direction.</text>

  <rect class="box tool" x="55" y="1225" width="420" height="220"/>
  <text class="title" x="85" y="1262">RP23CNC signal side</text><text class="subtitle" x="85" y="1285">exact terminal names still TBD</text>
  <rect class="term" x="90" y="1310" width="245" height="28"/><text class="label" x="112" y="1330">5V REF TBD</text><circle class="pin" cx="475" cy="1324" r="7"/>
  <rect class="term" x="90" y="1350" width="245" height="28"/><text class="label" x="112" y="1370">GND REF TBD</text><circle class="pin" cx="475" cy="1364" r="7"/>
  <rect class="term" x="90" y="1390" width="245" height="28"/><text class="label" x="112" y="1410">SPINDLE ENA OUT</text><circle class="pin" cx="475" cy="1404" r="7"/>
  <rect class="term" x="90" y="1430" width="245" height="28"/><text class="label" x="112" y="1450">AUX0 HOME_ARM OUT</text><circle class="pin" cx="475" cy="1444" r="7"/>
  <text class="tiny" x="90" y="1478">A limit/home input uses separate TBD switch-like path.</text>

