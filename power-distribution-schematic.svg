  <rect class="term" x="655" y="1390" width="115" height="28"/><text class="label" x="678" y="1410">IN1</text><circle class="pin" cx="620" cy="1404" r="7"/>
  <rect class="term" x="655" y="1430" width="115" height="28"/><text class="label" x="678" y="1450">IN2</text><circle class="pin" cx="620" cy="1444" r="7"/>
  <rect class="term" x="955" y="1310" width="115" height="28"/><text class="label" x="973" y="1330">VCC OUT</text><circle class="pin" cx="1120" cy="1324" r="7"/>
  <rect class="term" x="955" y="1350" width="115" height="28"/><text class="label" x="972" y="1370">GND OUT</text><circle class="pin" cx="1120" cy="1364" r="7"/>
  <rect class="term" x="955" y="1390" width="115" height="28"/><text class="label" x="978" y="1410">OUT1</text><circle class="pin" cx="1120" cy="1404" r="7"/>
  <rect class="term" x="955" y="1430" width="115" height="28"/><text class="label" x="978" y="1450">OUT2</text><circle class="pin" cx="1120" cy="1444" r="7"/>
  <rect class="box tool" x="1275" y="1225" width="430" height="220"/>
  <text class="title" x="1305" y="1262">SparkFun Pro Micro RP2350</text><text class="subtitle" x="1305" y="1285">toolhead logic side</text>
  <rect class="term" x="1430" y="1310" width="210" height="28"/><text class="label" x="1452" y="1330">3V3</text><circle class="pin" cx="1275" cy="1324" r="7"/>
  <rect class="term" x="1430" y="1350" width="210" height="28"/><text class="label" x="1452" y="1370">GND</text><circle class="pin" cx="1275" cy="1364" r="7"/>
  <rect class="term" x="1430" y="1390" width="210" height="28"/><text class="label" x="1452" y="1410">GP8 M3/M5 IN</text><circle class="pin" cx="1275" cy="1404" r="7"/>
  <rect class="term" x="1430" y="1430" width="210" height="28"/><text class="label" x="1452" y="1450">GP10 HOME_ARM IN</text><circle class="pin" cx="1275" cy="1444" r="7"/>
  <text class="tiny" x="1305" y="1478">GP9 A_HOME output not shown as final until interface is verified.</text>

  <path class="wire p12" d="M475 1324 H620"/><path class="wire gnd" d="M475 1364 H620"/><path class="wire m3" d="M475 1404 H620"/><path class="wire arm" d="M475 1444 H620"/>
  <path class="wire p33" d="M1120 1324 H1275"/><path class="wire gnd" d="M1120 1364 H1275"/><path class="wire m3" d="M1120 1404 H1275"/><path class="wire arm" d="M1120 1444 H1275"/>
