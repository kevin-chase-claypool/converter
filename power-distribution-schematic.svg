  <rect class="box load" x="1310" y="256" width="360" height="86"/><text class="title" x="1340" y="293">X TB6600</text><text class="subtitle" x="1340" y="316">12 V stepper driver branch</text><circle class="pin" cx="1310" cy="298" r="7"/><circle class="pin" cx="1310" cy="324" r="7"/><path class="wire p12" d="M1195 298 H1310"/><path class="wire gnd" d="M1195 324 H1310"/>
  <rect class="box load" x="1310" y="336" width="360" height="86"/><text class="title" x="1340" y="373">Y TB6600</text><text class="subtitle" x="1340" y="396">12 V stepper driver branch</text><circle class="pin" cx="1310" cy="378" r="7"/><circle class="pin" cx="1310" cy="404" r="7"/><path class="wire p12" d="M1195 378 H1310"/><path class="wire gnd" d="M1195 404 H1310"/>
  <rect class="box load" x="1310" y="416" width="360" height="86"/><text class="title" x="1340" y="453">A TB6600</text><text class="subtitle" x="1340" y="476">12 V stepper driver branch</text><circle class="pin" cx="1310" cy="458" r="7"/><circle class="pin" cx="1310" cy="484" r="7"/><path class="wire p12" d="M1195 458 H1310"/><path class="wire gnd" d="M1195 484 H1310"/>

  <rect class="box din" x="840" y="650" width="355" height="155"/>
  <text class="title" x="880" y="690">Pololu D36V50F6</text><text class="subtitle" x="880" y="713">DIN-side fixed 6 V regulator</text>
  <rect class="term" x="900" y="745" width="85" height="28"/><text class="label" x="925" y="765">VIN</text><rect class="term" x="900" y="775" width="85" height="28"/><text class="label" x="922" y="795">GND</text>
  <rect class="term" x="1075" y="745" width="85" height="28"/><text class="label" x="1093" y="765">VOUT</text><rect class="term" x="1075" y="775" width="85" height="28"/><text class="label" x="1098" y="795">GND</text>
  <circle class="pin" cx="940" cy="650" r="7"/><circle class="pin" cx="980" cy="650" r="7"/><circle class="pin" cx="1195" cy="759" r="7"/><circle class="pin" cx="1195" cy="789" r="7"/>
